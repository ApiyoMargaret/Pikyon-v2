name: CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  backend-checks:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify Backend Directory
        run: |
          if [ -f "backend/go.mod" ]; then
            cd backend
            go vet ./... || true
          else
            echo "Backend go.mod not found. Skipping Go checks."
          fi

  frontend-checks:
    name: Frontend Lint & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Frontend Directory
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci
          else
            echo "Frontend package.json not found. Skipping Node checks."
          fi