name: CI Workflow

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  backend-checks:
    name: Backend Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Backend Quality & Test Pipeline
        run: |
          if [ -d "backend" ] && [ -f "backend/go.mod" ]; then
            cd backend
            echo "--- Running govet ---"
            go vet ./...
            echo "--- Running tests ---"
            go test -v ./...
          else
            echo "No backend module found at backend/go.mod. Skipping backend checks cleanly."
          fi

  frontend-checks:
    name: Frontend Lint & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Frontend Quality & Test Pipeline
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            echo "--- Installing dependencies ---"
            npm ci || npm install
            echo "--- Running linter ---"
            npm run lint --if-present
            echo "--- Running tests ---"
            npm test --if-present -- --watch=false
          else
            echo "No frontend package found at frontend/package.json. Skipping frontend checks cleanly."
          fi