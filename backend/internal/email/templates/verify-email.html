<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
    .container { background: #f4f4f4; padding: 20px; border-radius: 8px; }
    .button { display: inline-block; padding: 10px 20px; background: #3498db; color: #fff; text-decoration: none; border-radius: 4px; margin: 20px 0; }
    .footer { font-size: 12px; color: #777; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Verify Your Email</h2>
    <p>Hello {{ .name }},</p>
    <p>Click the button below to verify your email address:</p>
    <a href="{{ .verificationURL }}" class="button">Verify Email</a>
    <p>This link will expire in 24 hours.</p>
    <p>If you didn't sign up for Pikyon, you can safely ignore this email.</p>
    <div class="footer">
      © {{ .currentYear }} Pikyon. All rights reserved.
    </div>
  </div>
</body>
</html>
