<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Someone Viewed Your Memory</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
    .container { background: #f4f4f4; padding: 20px; border-radius: 8px; }
    .button { display: inline-block; padding: 10px 20px; background: #3498db; color: #fff; text-decoration: none; border-radius: 4px; margin: 20px 0; }
    .footer { font-size: 12px; color: #777; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Someone Viewed Your Memory</h2>
    <p>Hello {{ .name }},</p>
    <p>{{ .memoryTitle }} has been viewed by someone.</p>
    <a href="{{ .memoryID }}" class="button">View Details</a>
    <p>Log in to Pikyon to see who viewed your memory.</p>
    <div class="footer">
      © {{ .currentYear }} Pikyon. All rights reserved.
    </div>
  </div>
</body>
</html>
